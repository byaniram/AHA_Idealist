<!DOCTYPE html>
<html>
<head>
<title>Meeting Prep Planner Agent</title>
<style>
  body {
    font-family: sans-serif;
  }
  .center {
    text-align: center;
  }
  #task_id_field{
    width: 200px;
  }
</style>
</head>
<body>

<h1 class="center" style="font-size: 16px; font-weight: bold;">Meeting Prep Planner Agent</h1>
<p class="center" style="font-size: 14px;">Enter a valid Task Id for the "First Meeting" Task in Salesforce</p>

<br><br>

<div class="center">
  <label for="taskId" style="font-size: 12px;">Enter Task Id:</label>
  <input type="text" id="taskId" name="taskId" maxlength="18">
  <button id="submitBtn" disabled>Submit</button>
</div>

<div class="center" id="errorMsg" style="color: red; font-size: 12px;"></div>

<div class="center" id="processingMsg" style="font-size: 12px; display: none;">Processing...</div>
<div class="center" id="processingCompleteMsg" style="font-size: 12px; display: none; color: green;">Processing Complete</div>

<div class="center" id="outputMessage" style="font-size: 12px;"></div>

<br>

<div class="center">
  <button id="clearBtn">Clear Form</button>
</div>

<script>
  const taskIdInput = document.getElementById("taskId");
  const submitBtn = document.getElementById("submitBtn");
  const errorMsg = document.getElementById("errorMsg");
  const processingMsg = document.getElementById("processingMsg");
  const processingCompleteMsg = document.getElementById("processingCompleteMsg");
  const outputMessage = document.getElementById("outputMessage");
  const clearBtn = document.getElementById("clearBtn");

  const apiUrl = "https://elastic.snaplogic.com/api/1/rest/slsched/feed/SLoS_Dev/projects/RB_Agent_Creator_IPA2/MP_Task_Outreach_1_API";
  const bearerToken = "nWpSsOLoXbTJYHQwsLllP1FVA4FoiuW9";

  taskIdInput.addEventListener("input", function() {
    if (taskIdInput.value.length === 18) {
      submitBtn.disabled = false;
      errorMsg.textContent = "";
    } else {
      submitBtn.disabled = true;
      errorMsg.textContent = "";  // Clear the error message until a new invalid input comes
    }
  });

  submitBtn.addEventListener("click", function() {
    const taskId = taskIdInput.value;

    if (taskId.length !== 18) {
      errorMsg.textContent = "Task Id must be 18 characters";
      taskIdInput.focus();
      return;
    }

    errorMsg.textContent = "";
    processingMsg.style.display = "block";
    processingCompleteMsg.style.display = "none";
    outputMessage.textContent = "";
    submitBtn.disabled = true; // Disable the submit button after click

    fetch(`${apiUrl}?TaskId=${taskId}`, {
      method: "GET",
      headers: {
        "Authorization": `Bearer ${bearerToken}`
      },
      signal: AbortSignal.timeout(600000) // 10 minutes timeout
    })
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }
      return response.text(); // Changed from response.json() to response.text()
    })
    .then(responseText => {
      processingMsg.style.display = "none";
      processingCompleteMsg.style.display = "block";

      // Check if the responseText is a valid JSON string
      try {
        const data = JSON.parse(responseText);

        if (Array.isArray(data) && data.length > 0 && data[0].hasOwnProperty("OutMessage")) {
          outputMessage.textContent = data[0].OutMessage;
        } else {
          outputMessage.textContent = "Error: Could not retrieve OutMessage from the response.";
        }
      } catch (error) {
        // If JSON parsing fails, assume the entire response is the message
        outputMessage.textContent = responseText;
      }
    })
    .catch(error => {
      console.error("Fetch error:", error); // Log the error to the console
      processingMsg.style.display = "none";
      processingCompleteMsg.style.display = "block"; // Still show completion even if error
      outputMessage.textContent = "Error: " + error;
    });
  });

  clearBtn.addEventListener("click", function() {
    taskIdInput.value = "";
    submitBtn.disabled = true;
    errorMsg.textContent = "";
    processingMsg.style.display = "none";
    processingCompleteMsg.style.display = "none";
    outputMessage.textContent = "";
    taskIdInput.focus();
  });
</script>

</body>
</html>
