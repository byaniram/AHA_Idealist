<!DOCTYPE html>
<html>
<head>
<title>Meeting Prep Planner Agent</title>
<style>
  body {
    font-family: sans-serif;
  }
  .center {
    text-align: center;
  }
  #task_id_field {
    width: 200px;
  }
</style>
</head>
<body>

<h1 class="center" style="font-size: 16px; font-weight: bold;">Meeting Prep Planner Agent</h1>
<p class="center" style="font-size: 14px;">Enter a valid Task Id for the "First Meeting" Task in Salesforce</p>

<br><br>

<div class="center">
  <label for="taskId" style="font-size: 12px;">Enter Task Id:</label>
  <input type="text" id="taskId" name="taskId" maxlength="18">
  <button id="submitBtn" disabled>Submit</button>
</div>

<div class="center" id="errorMsg" style="color: red; font-size: 12px;"></div>

<div class="center" id="processingMsg" style="font-size: 12px; display: none;">Processing...</div>
<div class="center" id="processingCompleteMsg" style="font-size: 12px; display: none; color: green;">Processing Complete</div>

<div class="center" id="outputMessage" style="font-size: 12px;"></div>

<br>

<div class="center">
  <button id="clearBtn">Clear Form</button>
</div>

<script>
  const taskIdInput = document.getElementById("taskId");
  const submitBtn = document.getElementById("submitBtn");
  const errorMsg = document.getElementById("errorMsg");
  const processingMsg = document.getElementById("processingMsg");
  const processingCompleteMsg = document.getElementById("processingCompleteMsg");
  const outputMessage = document.getElementById("outputMessage");
  const clearBtn = document.getElementById("clearBtn");

  const apiUrl = "https://elastic.snaplogic.com/api/1/rest/slsched/feed/SLoS_Dev/projects/RB_Agent_Creator_IPA2/MP_Task_Outreach_1_API";
  const bearerToken = "nWpSsOLoXbTJYHQwsLllP1FVA4FoiuW9";

  let pollingInterval = null;
  let pollingTimeout = null;

  taskIdInput.addEventListener("input", function () {
    submitBtn.disabled = (taskIdInput.value.length !== 18);
    errorMsg.textContent = "";
  });

  submitBtn.addEventListener("click", async function () {
    const taskId = taskIdInput.value;

    if (taskId.length !== 18) {
      errorMsg.textContent = "Task Id must be 18 characters";
      taskIdInput.focus();
      return;
    }

    // Reset UI
    errorMsg.textContent = "";
    processingMsg.style.display = "block";
    processingCompleteMsg.style.display = "none";
    outputMessage.textContent = "";
    submitBtn.disabled = true;

    try {
      // Start the task with POST and JSON body
      const startResponse = await fetch(apiUrl, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${bearerToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ TaskId: taskId, startTask: true })
      });

      if (!startResponse.ok) throw new Error(`Start request failed: ${startResponse.status}`);

      // Begin polling every 5 seconds
      pollingInterval = setInterval(async () => {
        try {
          const statusResponse = await fetch(`${apiUrl}?TaskId=${taskId}`, {
            method: "GET",
            headers: {
              "Authorization": `Bearer ${bearerToken}`,
              "Content-Type": "application/json"
            }
          });

          if (!statusResponse.ok) {
            const errorText = await statusResponse.text();
            throw new Error(`HTTP ${statusResponse.status}: ${errorText}`);
          }

          const responseText = await statusResponse.text();
          let data;
          try {
            data = JSON.parse(responseText);
          } catch (parseErr) {
            console.log("Polling response not ready yet:", responseText);
            return; // Continue polling
          }

          // Stop polling if OutMessage is present
          if (Array.isArray(data) && data.length > 0 && data[0].OutMessage) {
            clearInterval(pollingInterval);
            clearTimeout(pollingTimeout);

            processingMsg.style.display = "none";
            processingCompleteMsg.style.display = "block";
            outputMessage.textContent = data[0].OutMessage;
          }
        } catch (pollError) {
          clearInterval(pollingInterval);
          clearTimeout(pollingTimeout);
          processingMsg.style.display = "none";
          processingCompleteMsg.style.display = "block";
          outputMessage.textContent = "Error during status check: " + pollError;
        }
      }, 5000);

      // Safety timeout to stop polling after 15 minutes
      pollingTimeout = setTimeout(() => {
        clearInterval(pollingInterval);
        processingMsg.style.display = "none";
        processingCompleteMsg.style.display = "block";
        outputMessage.textContent = "Error: Task polling timed out after 15 minutes.";
      }, 15 * 60 * 1000);

    } catch (error) {
      processingMsg.style.display = "none";
      processingCompleteMsg.style.display = "block";
      outputMessage.textContent = "Error: " + error;
    }
  });

  clearBtn.addEventListener("click", function () {
    taskIdInput.value = "";
    submitBtn.disabled = true;
    errorMsg.textContent = "";
    processingMsg.style.display = "none";
    processingCompleteMsg.style.display = "none";
    outputMessage.textContent = "";
    taskIdInput.focus();
    if (pollingInterval) clearInterval(pollingInterval);
    if (pollingTimeout) clearTimeout(pollingTimeout);
  });
</script>

</body>
</html>
