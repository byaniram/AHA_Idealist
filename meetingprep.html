<!DOCTYPE html>
<html>
<head>
    <title>Meeting Prep Planner Agent</title>
    <style>
        body {
            font-family: sans-serif;
        }
        #task-id-input {
            width: 200px; /* Adjust width as needed */
        }
        #submit-button {
            cursor: pointer;
        }
        #submit-button:disabled {
            background-color: #cccccc;
            color: #666666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1 style="font-size: 16px; font-weight: bold;">Meeting Prep Planner Agent</h1>
    <br><br>

    <label for="task-id-input" style="font-size: 12px;">Enter Task Id:</label>
    <input type="text" id="task-id-input" maxlength="12">
    <span id="error-message" style="color: red;"></span>
    <br><br>

    <button id="submit-button" disabled>Submit</button>
    <br><br>

    <div id="output-message"></div>

    <button id="clear-button">Clear Form</button>

    <script>
        const taskIdInput = document.getElementById('task-id-input');
        const errorMessage = document.getElementById('error-message');
        const submitButton = document.getElementById('submit-button');
        const outputMessageDiv = document.getElementById('output-message');
        const clearButton = document.getElementById('clear-button');
        const apiUrl = "https://elastic.snaplogic.com/api/1/rest/slsched/feed/SLoS_Dev/projects/RB_Agent_Creator_IPA2/MP_Task_Outreach_1_API";
        const bearerToken = "nWpSsOLoXbTJYHQwsLllP1FVA4FoiuW9";

        taskIdInput.addEventListener('input', function() {
            if (this.value.length === 12) {
                errorMessage.textContent = '';
                submitButton.disabled = false;
            } else {
                errorMessage.textContent = 'Task Id must be 12 characters';
                submitButton.disabled = true;
            }
        });

        submitButton.addEventListener('click', function() {
            const taskId = taskIdInput.value;

            if (taskId.length !== 12) { // Double check, just in case
                errorMessage.textContent = 'Task Id must be 12 characters';
                taskIdInput.focus();
                return;
            }

            submitButton.disabled = true;  // Disable after click.

            fetch(`${apiUrl}?TaskId=${taskId}`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${bearerToken}`
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (Array.isArray(data) && data.length > 0 && data[0].OutMessage) {
                    outputMessageDiv.textContent = data[0].OutMessage;
                } else {
                    outputMessageDiv.textContent = "Unexpected response format.";
                }
            })
            .catch(error => {
                outputMessageDiv.textContent = "Error: " + error.message;
            });
        });

        clearButton.addEventListener('click', function() {
            taskIdInput.value = '';
            errorMessage.textContent = '';
            outputMessageDiv.textContent = '';
            submitButton.disabled = true;
            taskIdInput.focus();  // Return cursor to the input field
        });


        taskIdInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent form submission
                if (!submitButton.disabled) {
                    submitButton.click(); // Trigger the submit button's click event
                }
            }
        });
    </script>

</body>
</html>
